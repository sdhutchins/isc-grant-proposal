name: render-proposal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto with TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render PDF and HTML
        run: |
          quarto render isc-proposal.qmd --to hikmah-pdf
          quarto render isc-proposal.qmd --to html

      - name: Upload rendered proposal
        uses: actions/upload-artifact@v4
        with:
          name: isc-proposal
          path: |
            isc-proposal.pdf
            isc-proposal.html
